<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonas Eleitorais - Mapa Interativo</title>
    <link href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet"> <!-- reuse base styles -->
    <link href="zone.css" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">
            <i class="fas fa-layer-group"></i>
            <h1>Mapa das Zonas Eleitorais</h1>
        </div>
        <div class="controls">
            <div class="filter-group">
                <span class="filter-label">Cidade</span>
                <select id="cidade-select">
                    <option value="">Carregando cidades...</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Ano</span>
                <select id="ano">
                    <option value="2024" selected>2024</option>
                    <option value="2026">2026</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Turno</span>
                <select id="turno">
                    <option value="1" selected>1º Turno</option>
                    <option value="2">2º Turno</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Cargo</span>
                <select id="cargo">
                    <option value="0011" selected>Prefeito</option>
                    <option value="0001">Presidente</option>
                    <option value="0003">Governador</option>
                    <option value="0005">Senador</option>
                </select>
            </div>
            <button id="btn-back" class="back-button">
                <i class="fas fa-arrow-left"></i> Voltar ao mapa municipal
            </button>
        </div>
    </header>
    <div id="map-container">
        <div id="map"></div>
        <div id="info-panel" class="info-panel hidden">
            <div class="panel-header">
                <h2>Detalhes da Zona</h2>
                <button id="close-panel" class="close-btn">×</button>
            </div>
            <div id="panel-content">
                <p>Clique em uma zona para ver os resultados.</p>
            </div>
        </div>
        <div id="loading-overlay" style="display: none;">
            <div class="spinner"></div>
            <div>Carregando zonas eleitorais...</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text"></div>
        </div>
    </div>
    <footer>Dados fornecidos pelo TSE | Zonas Eleitorais</footer>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="zone.js" type="module"></script>
</body>

</html>
